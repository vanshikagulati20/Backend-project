<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management - Smart Warehouse</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }


        /* =========================
           HEADER
        ========================== */

        .header {
            background-color: #111;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .home-link {
            color: #ff8c00;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link:hover {
            color: #ffa733;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }


        /* =========================
           FORM BOX
        ========================== */

        .form-box {
            background-color: white;

            padding: 25px;

            border-radius: 10px;

            margin-bottom: 30px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #111;
        }

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff8c00;
        }

        .full-width {
            grid-column: 1 / 3;
        }


        /* =========================
           CUSTOM DIMENSIONS
        ========================== */

        /*
            This is hidden when the page loads.

            JavaScript will change this to:

            display: block;

            when the user selects
            "Custom Dimensions".
        */

        .custom-dimensions {
            display: none;

            grid-column: 1 / 3;

            background-color: #fff7ed;

            border: 1px solid #ff8c00;

            border-radius: 8px;

            padding: 20px;
        }

        .custom-dimensions h3 {
            margin-bottom: 15px;

            color: #111;
        }

        .dimension-grid {
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            gap: 15px;
        }


        /* =========================
           BUTTONS
        ========================== */

        .button-group {
            margin-top: 5px;
        }

        .btn {
            padding: 11px 20px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;
        }

        .add-btn {
            background-color: #ff8c00;

            color: white;
        }

        .add-btn:hover {
            background-color: #e67e00;
        }

        .cancel-btn {
            background-color: #222;

            color: white;

            margin-left: 8px;

            display: none;
        }

        .cancel-btn:hover {
            background-color: #000;
        }

        .edit-btn {
            background-color: #ff8c00;

            color: white;

            padding: 7px 12px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            margin-right: 5px;
        }

        .delete-btn {
            background-color: #222;

            color: white;

            padding: 7px 12px;

            border: none;

            border-radius: 5px;

            cursor: pointer;
        }

        .edit-btn:hover {
            background-color: #e67e00;
        }

        .delete-btn:hover {
            background-color: #000;
        }


        /* =========================
           PRODUCTS TABLE
        ========================== */

        .products-box {
            background-color: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .products-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            gap: 20px;
        }

        .products-top h2 {
            color: #111;
        }

        .search-input {
            width: 280px;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            outline: none;
        }

        .search-input:focus {
            border-color: #ff8c00;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 1000px;
        }

        th,
        td {
            padding: 13px;

            text-align: left;

            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #111;

            color: white;
        }

        tr:hover {
            background-color: #fafafa;
        }

        .empty-message {
            text-align: center;

            padding: 25px;

            color: #777;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 700px) {

            .header {
                padding: 18px 20px;
            }

            .container {
                width: 95%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: 1;
            }

            .custom-dimensions {
                grid-column: 1;
            }

            .dimension-grid {
                grid-template-columns: 1fr;
            }

            .products-top {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <h1>
            Smart Warehouse
        </h1>

        <a
            href="dashBoard.html"
            class="home-link"
        >
            Home
        </a>

    </header>



    <main class="container">


        <!-- =========================
             ADD PRODUCT FORM
        ========================== -->

        <section class="form-box">

            <h2 id="formTitle">
                Add Product
            </h2>


            <form id="productForm">

                <div class="form-grid">


                    <!-- PRODUCT NAME -->

                    <div class="form-group">

                        <label for="productName">
                            Product Name *
                        </label>

                        <input
                            type="text"
                            id="productName"
                            placeholder="Example: Dell Laptop"
                            required
                        >

                    </div>



                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category *
                        </label>

                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="Laptop">
                                Laptop
                            </option>

                            <option value="Mobile">
                                Mobile
                            </option>

                            <option value="Monitor">
                                Monitor
                            </option>

                            <option value="Keyboard">
                                Keyboard
                            </option>

                            <option value="Mouse">
                                Mouse
                            </option>

                            <option value="Headphones">
                                Headphones
                            </option>

                            <option value="Printer">
                                Printer
                            </option>

                            <option value="Router">
                                Router
                            </option>

                            <option value="Cables">
                                Cables
                            </option>

                            <option value="Computer Accessories">
                                Computer Accessories
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- QUANTITY -->

                    <div class="form-group">

                        <label for="quantity">
                            Quantity *
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            min="1"
                            placeholder="Example: 50"
                            required
                        >

                    </div>



                    <!-- UNIT -->

                    <div class="form-group">

                        <label for="unit">
                            Unit *
                        </label>

                        <select
                            id="unit"
                            required
                        >

                            <option value="Pieces">
                                Pieces
                            </option>

                            <option value="Boxes">
                                Boxes
                            </option>

                            <option value="Sets">
                                Sets
                            </option>

                            <option value="Packs">
                                Packs
                            </option>

                            <option value="Cartons">
                                Cartons
                            </option>

                            <option value="Pallets">
                                Pallets
                            </option>

                        </select>

                    </div>



                    <!-- PRODUCT SIZE -->

                    <div class="form-group full-width">

                        <label for="size">
                            Product Size *
                        </label>

                        <select
                            id="size"
                            required
                        >

                            <option value="">
                                Select Product Size
                            </option>

                            <option value="Small">
                                Small
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Large">
                                Large
                            </option>

                            <option value="Custom">
                                Custom Dimensions
                            </option>

                        </select>

                    </div>



                    <!-- =========================
                         CUSTOM DIMENSIONS

                         IMPORTANT:
                         This is hidden initially.

                         It appears only when
                         Custom Dimensions
                         is selected.
                    ========================== -->

                    <div
                        id="customDimensions"
                        class="custom-dimensions"
                    >

                        <h3>
                            Enter Product Dimensions
                        </h3>


                        <div class="dimension-grid">


                            <!-- LENGTH -->

                            <div class="form-group">

                                <label for="length">
                                    Length (cm) *
                                </label>

                                <input
                                    type="number"
                                    id="length"
                                    min="0.1"
                                    step="0.01"
                                    placeholder="Example: 40"
                                >

                            </div>



                            <!-- BREADTH -->

                            <div class="form-group">

                                <label for="breadth">
                                    Breadth (cm) *
                                </label>

                                <input
                                    type="number"
                                    id="breadth"
                                    min="0.1"
                                    step="0.01"
                                    placeholder="Example: 30"
                                >

                            </div>



                            <!-- HEIGHT -->

                            <div class="form-group">

                                <label for="height">
                                    Height (cm) *
                                </label>

                                <input
                                    type="number"
                                    id="height"
                                    min="0.1"
                                    step="0.01"
                                    placeholder="Example: 10"
                                >

                            </div>

                        </div>

                    </div>



                    <!-- WEIGHT -->

                    <div class="form-group">

                        <label for="weight">
                            Weight per Unit (kg) *
                        </label>

                        <input
                            type="number"
                            id="weight"
                            min="0.01"
                            step="0.01"
                            placeholder="Example: 1.5"
                            required
                        >

                    </div>



                    <!-- FRAGILE -->

                    <div class="form-group">

                        <label for="fragile">
                            Fragile *
                        </label>

                        <select
                            id="fragile"
                            required
                        >

                            <option value="No">
                                No
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                        </select>

                    </div>



                    <!-- BUTTONS -->

                    <div class="full-width button-group">

                        <button
                            type="submit"
                            class="btn add-btn"
                            id="submitBtn"
                        >
                            Add Product
                        </button>


                        <button
                            type="button"
                            class="btn cancel-btn"
                            id="cancelBtn"
                        >
                            Cancel
                        </button>

                    </div>

                </div>

            </form>

        </section>



        <!-- =========================
             PRODUCT TABLE
        ========================== -->

        <section class="products-box">

            <div class="products-top">

                <h2>
                    Products
                </h2>


                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search product..."
                >

            </div>



            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Product Name
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Quantity
                            </th>

                            <th>
                                Unit
                            </th>

                            <th>
                                Size
                            </th>

                            <th>
                                Weight
                            </th>

                            <th>
                                Fragile
                            </th>

                            <th>
                                Dimensions
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="productTableBody">

                        <!-- JavaScript will add products here -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>



    <!-- JavaScript -->

    <script src="product.js"></script>

</body>

</html>
