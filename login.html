<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogIn - Storvia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <h1>Storvia</h1>

            <h2>LogIn to Your Account</h2>

            <form id="LogInForm" onsubmit="submitLogin(event)">


                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

               
                <p class="auth-link" id="warning"></p>
                <button type="submit" >LogIn</button>

            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="signup.html">SignUp</a>
            </p>

        </div>

    </main>

</body>



<script>
  const warning = document.getElementById("warning");

  function validateLogin(email, password) {
    if (email.trim() === "") return "Email is required";
    if (password.trim() === "") return "Password is required";
    return null;
  }

  async function submitLogin(event) {
    event.preventDefault();
    warning.innerText = "";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const validationMessage = validateLogin(email, password);

    if (validationMessage) {
      warning.style.color = "red";
      warning.innerText = validationMessage;
      return;
    }

    try {
      const response = await fetch("http://localhost:5000/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email.trim(),
          password: password
        })
      });

      const result = await response.json();

      if (!response.ok) {
        warning.style.color = "red";
        warning.innerText = result.message;
        return;
      }

      localStorage.setItem("currentuser", JSON.stringify(result.user));
      window.location.href = "dashBoard.html";

    } catch (error) {
      warning.style.color = "red";
      warning.innerText = "Cannot connect to server. Please try again.";
      console.error("Login request failed:", error);
    }
  }
</script>


</html>
