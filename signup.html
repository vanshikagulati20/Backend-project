<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Storvia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <h1>Storvia</h1>

            <h2>Create Account</h2>

            <form id="signupForm" onsubmit="submitSignup(event)">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        required
                    >
                </div>
                <p class="auth-link" id="warning"></p>
                <button type="submit" >Create Account</button>

            </form>

            <p class="auth-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>

</body>


<script>
    let form=document.getElementById("signupForm");

    let warning=document.getElementById("warning")

   
    function validateSignup(name, email, password, cpassword) {

            if (name.trim() === "") {
                return "Name is required";
            }

            if (name.trim().length < 2) {

                return "Name must be at least 2 characters";
            }

            if (email.trim() === "") {

                return "Email is required";
            }

            if (password.length < 8) {

                return "Password must be at least 8 characters";
            }

            if (cpassword !== password) {

                return "Passwords do not match";
            }

            return null;
    }

    function submitSignup(e){

        e.preventDefault();

        warning.innerText="";

        let name=document.getElementById("name")

        let email=document.getElementById("email")

        let password=document.getElementById("password")

        let cpassword=document.getElementById("confirmPassword")

        let warning_text=validateSignup(name.value,email.value,password.value,cpassword.value);

        if(warning_text!=null){

            warning.innerText=warning_text;

            warning.style.color="red";

            return;
        }

        let users=JSON.parse(localStorage.getItem("users")) || [];

        let exists=users.some((cur)=>email.value.trim().toLowerCase()==cur.email);

        if(exists){

                warning.style.color="red";
                warning.innerText=" User with this Email already exists";
                return;
        }

        let user_obj={name:name.value, email:email.value.trim().toLowerCase(), password:password.value}

        users.push(user_obj)
        
        localStorage.setItem("users",JSON.stringify(users));

        window.location.href="login.html";

        }
        

       



        
    
</script>
</html>
