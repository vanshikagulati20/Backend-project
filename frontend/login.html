
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogIn - Storvia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-page">
        <div class="auth-container">
            <h1>Storvia</h1>
            <h2>LogIn to Your Account</h2>

            <form id="LogInForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p class="auth-link" id="warning" role="alert"></p>

                <button type="submit" id="loginButton">LogIn</button>
            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="signup.html">SignUp</a>
            </p>
        </div>
    </main>

    <script>
        const loginForm = document.getElementById("LogInForm");
        const warning = document.getElementById("warning");
        const loginButton = document.getElementById("loginButton");

        function showMessage(message, color = "red") {
            warning.textContent = message;
            warning.style.color = color;
        }

        function validateLogin(email, password) {
            if (!email.trim()) {
                return "Email is required";
            }

            if (!password) {
                return "Password is required";
            }

            return null;
        }

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            showMessage("");

            const email = document.getElementById("email").value
                .trim()
                .toLowerCase();

            const password = document.getElementById("password").value;

            const validationError = validateLogin(email, password);

            if (validationError) {
                showMessage(validationError);
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch(
                    "http://localhost:5000/api/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.success || !result.user) {
                    showMessage(result.message || "Unable to login");
                    return;
                }

                // Store only the logged-in user's details for frontend use.
                // Password is not stored in localStorage.
                localStorage.setItem(
                    "currentuser",
                    JSON.stringify(result.user)
                );

                window.location.href = "dashBoard.html";

            } catch (error) {
                console.error("Login error:", error);

                showMessage(
                    "Cannot connect to the server. Please make sure the backend is running."
                );
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "LogIn";
            }
        });
    </script>
</body>
</html>
