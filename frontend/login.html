<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogIn - Storvia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <h1>Storvia</h1>

            <h2>LogIn to Your Account</h2>

            <form id="LogInForm" onsubmit="submitLogin(event)">


                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

               
                <p class="auth-link" id="warning"></p>
                <button type="submit" >LogIn</button>

            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="signup.html">SignUp</a>
            </p>

        </div>

    </main>

</body>


<script>
    let form=document.getElementById("logInForm");

    let warning=document.getElementById("warning")

   
    function validateSignup(email, password) {

           

            if (email.trim() === "") {

                return "Email is required";
            }
            if(password.trim()===""){
                return "password is required";
            }


            return null;
    }

    function submitLogin(e){

        e.preventDefault();

        warning.innerText="";

    

        let email=document.getElementById("email")

        let password=document.getElementById("password")

       

        let warning_text=validateSignup(email.value,password.value);

        if(warning_text!=null){

            warning.innerText=warning_text;

            warning.style.color="red";

            return;
        }

        let users=JSON.parse(localStorage.getItem("users")) || [];

        let user=users.find((cur)=>email.value.trim().toLowerCase()==cur.email);

        if(!user){

                warning.style.color="red";
                warning.innerText="* No User Exists with this email";
                return;
        }

        if(user.password!==password.value){
            warning.style.color="red";
            warning.innerText="* Your password is incorrect";
            return;
        }

   
        let currentUser=user;

        localStorage.setItem("currentuser",JSON.stringify(currentUser));

        window.location.href="dashBoard.html"

        }
        

       



        
    
</script>
</html>
